[project]
name = "gelo"
version = "7.0.3"
description = "podcast chapter metadata gathering tool for podcast creators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests",
  "irc",
  "toml"
]

[project.scripts]
gelo = "gelo.command_line:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "responses>=0.25.8",
    "ty>=0.0.8",
]
